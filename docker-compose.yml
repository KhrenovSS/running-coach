services:
  # === PostgreSQL база данных (PostgreSQL database) ===
  db:
    image: postgres:16-alpine
    # Порт открыт только для внутренней сети Docker.
    # Для локальной разработки раскомментируйте:
    #ports:
    #  - "5432:5432"
    environment:
      POSTGRES_USER: running_coach
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: running_coach
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U running_coach"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # === FastAPI веб-приложение (FastAPI web application) ===
  app:
    build: .
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      DATABASE_URL: postgresql://running_coach:${POSTGRES_PASSWORD}@db:5432/running_coach
      TZ: Europe/Moscow
    volumes:
      - ./uploads:/app/uploads
      - ./logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  # === Telegram-бот (Telegram bot) ===
  bot:
    build: .
    command: python run_telegram_bot.py
    env_file: .env
    environment:
      DATABASE_URL: postgresql://running_coach:${POSTGRES_PASSWORD}@db:5432/running_coach
      TZ: Europe/Moscow
    # Доступ к LLM-мосту на хосте (host-side subscription bridge, DEV_PLAN §8)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Бот тоже синкает активности (sync_runner) — сырые FIT должны жить на хосте,
      # а не умирать с контейнером (bot also syncs — raw FITs must persist on the host)
      - ./uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # В образе python-slim НЕТ `ps` → проверяем cmdline PID 1 через /proc (grep есть в образе).
      # (No `ps` in python-slim; check PID 1 cmdline via /proc — grep is available.)
      test: ["CMD-SHELL", "grep -q run_telegram_bot /proc/1/cmdline || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped

volumes:
  pgdata: